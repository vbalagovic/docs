name: Sync OpenAPI to docs site

on:
  push:
    branches: [main]
    paths:
      - 'openapi.yaml'
      - 'docs.json'
      - '.github/workflows/sync-openapi.yml'
  pull_request:
    paths:
      - 'openapi.yaml'
      - 'docs.json'
  workflow_dispatch:

jobs:
  sync:
    name: Lint OpenAPI and validate docs config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@latest lint openapi.yaml

      - name: Validate docs.json
        run: node -e "JSON.parse(require('fs').readFileSync('docs.json','utf8'))"

  notify-mintlify:
    name: Trigger Mintlify rebuild
    needs: sync
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Ping Mintlify webhook
        env:
          MINTLIFY_WEBHOOK_URL: ${{ secrets.MINTLIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$MINTLIFY_WEBHOOK_URL" ]; then
            echo "MINTLIFY_WEBHOOK_URL not configured; skipping rebuild trigger."
            exit 0
          fi
          curl -fsSL -X POST "$MINTLIFY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"trigger":"docs-sync"}'
