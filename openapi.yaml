                summary: Regenerate via AI
                value:
                  regenerate: true
                  prompt: A serene yoga studio at dusk with golden light
                  style: photorealistic
      responses:
        "200":
          description: Image replaced synchronously (upload or url mode).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Image" }
        "202":
          description: Regeneration queued (regenerate mode).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: Uploaded file exceeds 10MB.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Missing replacement mode (no `file`, `url`, or `regenerate`).
          content:
