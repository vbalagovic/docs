security:
  - apiKeyAuth: []
tags:
  - name: Health
    description: Liveness, version, and the runtime OpenAPI document.
  - name: Projects
    description: |
      Project (formerly "tenant") metadata, API key management, and credit usage.
      Every API key resolves to exactly one project.
  - name: Brand
    description: |
      Canonical brand context — voice, colors, fonts, audience, content tone.
      This is the single source of truth that the MCP server's `brand://current`
      resource exposes to AI codegen tools.
  - name: Content
    description: |
      The CMS pillar. Translation keys map `dot.notation` keys to per-language
      values. Use `bulk` for build-time fetches of many keys at once.
  - name: Components
    description: |
      Editable HTML chunks registered by AI codegen tools during a build session.
      A registered component becomes editable in the project's admin UI.
  - name: Images
    description: Brand-consistent image generation, replacement, and resolution by key.
  - name: Blog
    description: |
      Full blog engine — posts, categories, tags, scheduling, multi-language
      translation, AI authoring pipeline.
  - name: Social
    description: |
      Social pillar — multi-platform post generation, scheduling, publishing,
      OAuth account connections.
  - name: Booking
    description: |
      Booking pillar — bookable services, weekly availability, slot lookup,
      bookings (admin + public), embeddable widget.
  - name: Commerce
    description: |
      Commerce pillar — products, variants, categories, orders, Stripe
      Checkout, Stripe Connect onboarding, embeddable widgets.
  - name: Jobs
    description: |
      Async work tracking. Every long-running AI op (blog gen, image gen,
      translation, content plan, website gen) returns a Job. Poll or stream.
  - name: Webhooks
    description: |
      Outgoing webhooks. Subscribe a URL to events your project cares about.
      All deliveries signed with HMAC-SHA256.
  - name: Forms
    description: |
      Lead-capture surfaces — newsletter subscribe and contact-form submit.
      Public submit endpoints (no auth, project resolved via
      `X-NeuralDraft-Project-Key` or `?project_id=`); admin list/delete
      endpoints require an API key with `forms:read` / `forms:write` scope.
      No credits charged — this is storage + delivery, not AI.
x-tagGroups:
  - name: Getting started
    tags: [Health, Projects, Brand]
  - name: CMS
    tags: [Content, Components, Images, Forms]
  - name: Content marketing
    tags: [Blog, Social]
  - name: Operations
    tags: [Booking, Commerce]
  - name: Async & integrations
    tags: [Jobs, Webhooks]
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: |
        Lightweight liveness check. **Does not require authentication** and
        does not consume credits or count against rate limits. Useful for
        load balancers, uptime monitors, and SDK preflight checks.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                ok:
                  value:
                    status: ok
                    version: "1.0.0"
                    uptime_s: 184523
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl https://api.neuraldraft.io/v1/health
        - lang: node
          label: Node (SDK)
          source: |
            import { NeuralDraft } from "@neuraldraft/sdk";
            const nd = new NeuralDraft();
            const health = await nd.health.check();
            console.log(health.status); // "ok"
        - lang: python
          label: Python (requests)
          source: |
            import requests
            r = requests.get("https://api.neuraldraft.io/v1/health")
            r.raise_for_status()
            print(r.json()["status"])
        - lang: php
          label: PHP (Guzzle)
          source: |
            <?php
            $client = new \GuzzleHttp\Client();
            $res = $client->get('https://api.neuraldraft.io/v1/health');
            $body = json_decode((string) $res->getBody(), true);
            echo $body['status'];
  /openapi.json:
    get:
      tags: [Health]
      summary: Serve this OpenAPI document
      description: |
        Returns the live OpenAPI 3.1 document. SDK generators and Mintlify
        fetch this at build time. Identical to the `openapi.yaml` checked into
        the repository, but always reflects the deployed contract.
      operationId: getOpenApiDocument
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl https://api.neuraldraft.io/v1/openapi.json > openapi.json
        - lang: node
          label: Node
          source: |
            const res = await fetch("https://api.neuraldraft.io/v1/openapi.json");
            const spec = await res.json();
        - lang: python
          label: Python
          source: |
            import requests, json
            spec = requests.get("https://api.neuraldraft.io/v1/openapi.json").json()
        - lang: php
          label: PHP
          source: |
            <?php
            $spec = json_decode(file_get_contents('https://api.neuraldraft.io/v1/openapi.json'), true);
  /projects/me:
    get:
      tags: [Projects]
      summary: Get the current project
      description: |
        Returns the project resolved from the API key in the request. Used by
        SDKs and the MCP server to bootstrap context (which project this key
        belongs to, what languages are configured, etc.).

        Read-only. Does not consume credits.
      operationId: getCurrentProject
      responses:
        "200":
          description: The project for this API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              examples:
                yoga_studio:
                  summary: A yoga studio
                  value:
                    id: prj_2NfQmBcKpXY8
                    name: Lakeside Yoga
                    slug: lakeside-yoga
                    industry: wellness
                    default_language: en
                    target_languages: [en, fr, de]
                    timezone: Europe/London
                    plan: hobby
                    created_at: "2026-02-14T09:31:18Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl https://api.neuraldraft.io/v1/projects/me \
              -H "Authorization: Bearer ndsk_live_yourkey"
        - lang: node
          label: Node (SDK)
          source: |
            import { NeuralDraft } from "@neuraldraft/sdk";
            const nd = new NeuralDraft({ apiKey: process.env.ND_API_KEY });
            const project = await nd.projects.me();
        - lang: python
          label: Python
          source: |
            import os, requests
            r = requests.get(
                "https://api.neuraldraft.io/v1/projects/me",
                headers={"Authorization": f"Bearer {os.environ['ND_API_KEY']}"},
            )
            project = r.json()
        - lang: php
          label: PHP
          source: |
            <?php
            $client = new \GuzzleHttp\Client(['base_uri' => 'https://api.neuraldraft.io/v1/']);
            $res = $client->get('projects/me', ['headers' => ['Authorization' => 'Bearer '.getenv('ND_API_KEY')]]);
            $project = json_decode((string)$res->getBody(), true);
    patch:
      tags: [Projects]
      summary: Update the current project
      description: |
        Updates project-level metadata. Use this to change the display name,
        timezone, default language, or to add/remove target languages.

        Adding a new target language **does not** auto-translate existing
        content — call `POST /content/{key}/translate` or
        `POST /blog-posts/{id}/translate` for that.

        Read-only fields (`id`, `slug`, `created_at`, `plan`) are ignored.
      operationId: updateCurrentProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
            examples:
              add_language:
                summary: Add German as a target language
                value:
                  target_languages: [en, fr, de]
              rename:
                summary: Rename and change timezone
                value:
                  name: Lakeside Yoga & Wellness
                  timezone: Europe/Paris
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              examples:
                renamed:
                  value:
                    id: prj_2NfQmBcKpXY8
                    name: Lakeside Yoga & Wellness
                    slug: lakeside-yoga
                    industry: wellness
                    default_language: en
                    target_languages: [en, fr, de]
                    timezone: Europe/Paris
                    plan: hobby
                    created_at: "2026-02-14T09:31:18Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X PATCH https://api.neuraldraft.io/v1/projects/me \
              -H "Authorization: Bearer ndsk_live_yourkey" \
              -H "Content-Type: application/json" \
              -d '{"target_languages":["en","fr","de"]}'
        - lang: node
          label: Node (SDK)
          source: |
            await nd.projects.update({ targetLanguages: ["en","fr","de"] });
        - lang: python
          label: Python
          source: |
            requests.patch(
                "https://api.neuraldraft.io/v1/projects/me",
                headers={"Authorization": f"Bearer {key}"},
                json={"target_languages": ["en","fr","de"]},
            )
        - lang: php
          label: PHP
          source: |
            <?php
            $client->patch('projects/me', [
              'headers' => ['Authorization' => 'Bearer '.$key],
              'json' => ['target_languages' => ['en','fr','de']],
            ]);
  /projects/me/usage:
    get:
      tags: [Projects]
      summary: Get credit usage for the current period
      description: |
        Returns current credit balance, period boundaries, and a breakdown of
        credits consumed by operation type since the period started.

        The period resets monthly on the same calendar day the project was
        created. Top-up credits do not expire and are consumed only after the
        plan allowance for the period is exhausted.
      operationId: getProjectUsage
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [current, previous]
            default: current
          description: Which billing period to return.
      responses:
        "200":
          description: Usage object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
              examples:
                hobby_user:
                  value:
                    period_start: "2026-04-01T00:00:00Z"
                    period_end: "2026-05-01T00:00:00Z"
                    plan: hobby
                    plan_credits: 5000
                    topup_credits: 2000
                    credits_used: 3260
                    credits_remaining: 3740
                    breakdown:
                      - op: blog_post.generate
                        count: 4
                        credits: 1600
                      - op: social_post.generate
                        count: 32
                        credits: 800
                      - op: image.generate
                        count: 18
                        credits: 720
                      - op: chat.message
                        count: 9
                        credits: 135
                      - op: storage.gb_month
                        count: 0.4
                        credits: 6
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl https://api.neuraldraft.io/v1/projects/me/usage \
              -H "Authorization: Bearer ndsk_live_yourkey"
        - lang: node
          label: Node (SDK)
          source: |
            const usage = await nd.projects.usage();
            console.log(`${usage.credits_remaining} credits left`);
        - lang: python
          label: Python
          source: |
            usage = requests.get(
                "https://api.neuraldraft.io/v1/projects/me/usage",
                headers={"Authorization": f"Bearer {key}"},
            ).json()
        - lang: php
          label: PHP
          source: |
            <?php
            $usage = json_decode((string) $client->get('projects/me/usage', [
              'headers' => ['Authorization' => 'Bearer '.$key],
            ])->getBody(), true);
  /projects/me/api-keys:
    get:
      tags: [Projects]
      summary: List API keys
      description: |
        Lists all API keys belonging to the current project. The full secret
        value is only shown once — at creation time. This endpoint returns
        masked previews (`ndsk_live_…XYZ`).
      operationId: listApiKeys
      responses:
        "200":
          description: Array of keys.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }
              examples:
                two_keys:
                  value:
                    data:
                      - id: key_2NfQB5GdkY9P
                        name: Production server
                        prefix: ndsk_live_
                        masked: ndsk_live_…7yQp
                        scopes: [content:read, content:write, commerce:read]
                        last_used_at: "2026-04-19T08:14:02Z"
                        created_at: "2026-02-14T09:32:00Z"
                      - id: key_2NgZBcmNop12
                        name: Lovable build session
                        prefix: ndsk_live_
                        masked: ndsk_live_…aA12
                        scopes: ["*"]
                        last_used_at: null
                        created_at: "2026-04-12T13:02:11Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl https://api.neuraldraft.io/v1/projects/me/api-keys \
              -H "Authorization: Bearer ndsk_live_yourkey"
        - lang: node
          label: Node (SDK)
          source: |
            const keys = await nd.projects.apiKeys.list();
        - lang: python
          label: Python
          source: |
            keys = requests.get(
                "https://api.neuraldraft.io/v1/projects/me/api-keys",
                headers={"Authorization": f"Bearer {key}"},
            ).json()["data"]
        - lang: php
          label: PHP
          source: |
            <?php
            $keys = json_decode((string) $client->get('projects/me/api-keys', [
              'headers' => ['Authorization' => 'Bearer '.$key],
            ])->getBody(), true)['data'];
    post:
      tags: [Projects]
      summary: Create an API key
      description: |
        Creates a new API key for the current project. The full secret is
        returned **once** in the `secret` field — store it immediately. After
        the response, only the masked preview is retrievable.

        Scopes follow `pillar:permission` syntax. Use `*` for full access.
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreate"
            examples:
              ci_key:
                summary: Read-only CI key
                value:
                  name: CI builds
                  scopes: [content:read, blog:read]
              full:
                summary: Full-access dev key
                value:
                  name: Local dev
                  scopes: ["*"]
      responses:
        "201":
          description: |
            The created key. The `secret` field is included **only in this
            response** — store it now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyWithSecret"
              examples:
                created:
                  value:
                    id: key_2Ngc7HpQrZk1
                    name: CI builds
                    prefix: ndsk_live_
                    masked: ndsk_live_…aB91
                    secret: ndsk_live_a5oqV2uY3sR8mD7fK9hP4tWcXeZi6jLg7yQpaB91
                    scopes: [content:read, blog:read]
                    last_used_at: null
                    created_at: "2026-04-19T10:02:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X POST https://api.neuraldraft.io/v1/projects/me/api-keys \
              -H "Authorization: Bearer ndsk_live_yourkey" \
              -H "Content-Type: application/json" \
              -d '{"name":"CI builds","scopes":["content:read","blog:read"]}'
        - lang: node
          label: Node (SDK)
          source: |
            const key = await nd.projects.apiKeys.create({
              name: "CI builds",
              scopes: ["content:read", "blog:read"],
            });
            console.log(key.secret); // store immediately
        - lang: python
          label: Python
          source: |
            r = requests.post(
                "https://api.neuraldraft.io/v1/projects/me/api-keys",
                headers={"Authorization": f"Bearer {key}"},
                json={"name": "CI builds", "scopes": ["content:read", "blog:read"]},
            )
            secret = r.json()["secret"]
        - lang: php
          label: PHP
          source: |
            <?php
            $created = json_decode((string) $client->post('projects/me/api-keys', [
              'headers' => ['Authorization' => 'Bearer '.$key],
              'json' => ['name' => 'CI builds', 'scopes' => ['content:read','blog:read']],
            ])->getBody(), true);
  /projects/me/api-keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/KeyIdPath"
    delete:
      tags: [Projects]
      summary: Revoke an API key
      description: |
        Permanently revokes the key. Subsequent requests authenticating with
        the revoked secret return `401 Unauthorized`. Cannot be undone.
        Revoking your last key locks you out of the API — be careful.
      operationId: revokeApiKey
      responses:
        "204":
          description: Revoked.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X DELETE https://api.neuraldraft.io/v1/projects/me/api-keys/key_2Ngc7HpQrZk1 \
              -H "Authorization: Bearer ndsk_live_yourkey"
        - lang: node
          label: Node (SDK)
          source: |
            await nd.projects.apiKeys.revoke("key_2Ngc7HpQrZk1");
        - lang: python
          label: Python
          source: |
            requests.delete(
                f"https://api.neuraldraft.io/v1/projects/me/api-keys/{key_id}",
                headers={"Authorization": f"Bearer {key}"},
            )
        - lang: php
          label: PHP
          source: |
            <?php
            $client->delete("projects/me/api-keys/{$keyId}", [
              'headers' => ['Authorization' => 'Bearer '.$key],
            ]);
  /brand:
    get:
      tags: [Brand]
      summary: Get the brand context
      description: |
        Returns the canonical brand object — voice, audience, content tone,
        colors, fonts, and goals. This is what the MCP server exposes as
        `brand://current` so AI codegen tools can write on-brand copy and
        styling automatically.

        Read-only. Does not consume credits.
      operationId: getBrand
      responses:
        "200":
          description: The brand object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
              examples:
                yoga_brand:
                  value:
                    voice: warm, grounded, inviting; avoids hype
                    audience: women 30-55 in greater London seeking stress relief
                    content_tone: friendly_professional
                    content_goals: [drive_class_signups, build_email_list]
                    preferred_topics: [breathwork, beginner_yoga, prenatal_yoga, mindfulness]
                    colors:
                      primary:
                        hex: "#3F6B5C"
                        name: deep sage
                      secondary:
                        hex: "#E8DCC4"
                        name: linen
                    fonts:
                      heading: Fraunces
                      body: Inter
                    logo_url: https://cdn.neuraldraft.io/prj_2NfQmBcKpXY8/logo.svg
                    description: A boutique yoga studio in Richmond offering small-group classes.
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl https://api.neuraldraft.io/v1/brand \
              -H "Authorization: Bearer ndsk_live_yourkey"
        - lang: node
          label: Node (SDK)
          source: |
            const brand = await nd.brand.get();
        - lang: python
          label: Python
          source: |
            brand = requests.get(
                "https://api.neuraldraft.io/v1/brand",
                headers={"Authorization": f"Bearer {key}"},
            ).json()
        - lang: php
          label: PHP
          source: |
            <?php
            $brand = json_decode((string) $client->get('brand', [
              'headers' => ['Authorization' => 'Bearer '.$key],
            ])->getBody(), true);
    patch:
      tags: [Brand]
      summary: Update the brand context
      description: |
        Partial update of the brand object. Any field omitted from the body is
        left unchanged. To clear a field, send `null` explicitly.

        Updating brand colors does **not** retroactively recolor generated
        images or already-published content. It changes future generations
        only. Issue follow-up `POST /images/{key}` calls to regenerate
        existing assets with the new palette.
