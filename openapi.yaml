              'headers' => ['Authorization' => 'Bearer '.$key],
              'json' => ['lang' => 'en', 'value' => 'Welcome to Lakeside Yoga'],
            ]);
    delete:
      tags: [Content]
      summary: Delete a content key
      description: |
