            ).json()
        - lang: php
          label: PHP
          source: |
            <?php
            $job = json_decode((string) $client->post('content/hero.headline/translate', [
              'headers' => ['Authorization' => 'Bearer '.$key],
              'json' => ['target_langs' => ['fr','de','es']],
            ])->getBody(), true);
  /components/register:
    post:
      tags: [Components]
      summary: Register an editable HTML component
      description: |
        Used by AI codegen tools (and the MCP server's `register_component`
        tool) during a build session. The tool says: "I just generated this
        hero section — register it as editable in the project's admin."

        Neural Draft parses the HTML, extracts every `data-translate="key"`
        attribute, creates the corresponding translation keys, and stores
        the HTML as a Component. The component then appears in the project
        admin as editable, and the MCP server can stream changes back via
        `content.changed` webhooks.

        Costs **0 credits** — registration itself is free. Future edits
        invoked through this component go through the standard content/image
        endpoints with their normal pricing.
      operationId: registerComponent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComponentRegisterInput" }
            examples:
              hero:
                summary: Register a hero section
                value:
                  html: |
                    <section class="hero" data-nd-component="hero">
                      <h1 data-translate="hero.headline">Find your calm</h1>
                      <p data-translate="hero.subhead">Boutique yoga in Richmond</p>
                      <a href="#book" data-translate="hero.cta">Book a class</a>
                    </section>
                  intent: marketing_hero
                  page_slug: home
      responses:
        "201":
          description: Component registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Component" }
              examples:
                registered:
                  value:
                    id: cmp_2Ngd9KqLmRpW
                    intent: marketing_hero
                    page_slug: home
                    html: |
                      <section class="hero" data-nd-component="hero">
                        <h1 data-translate="hero.headline">Find your calm</h1>
                        <p data-translate="hero.subhead">Boutique yoga in Richmond</p>
                        <a href="#book" data-translate="hero.cta">Book a class</a>
                      </section>
                    keys_created: [hero.headline, hero.subhead, hero.cta]
                    created_at: "2026-04-19T10:14:02Z"
                    updated_at: "2026-04-19T10:14:02Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X POST https://api.neuraldraft.io/v1/components/register \
              -H "Authorization: Bearer ndsk_live_yourkey" \
              -H "Content-Type: application/json" \
              -d @hero.json
        - lang: node
          label: Node (SDK)
          source: |
            const cmp = await nd.components.register({ html, intent: "marketing_hero", pageSlug: "home" });
        - lang: python
          label: Python
          source: |
            cmp = requests.post(
                "https://api.neuraldraft.io/v1/components/register",
                headers={"Authorization": f"Bearer {key}"},
                json={"html": html, "intent": "marketing_hero", "page_slug": "home"},
            ).json()
        - lang: php
          label: PHP
          source: |
            <?php
            $cmp = json_decode((string) $client->post('components/register', [
              'headers' => ['Authorization' => 'Bearer '.$key],
              'json' => ['html' => $html, 'intent' => 'marketing_hero', 'page_slug' => 'home'],
            ])->getBody(), true);
