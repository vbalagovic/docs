          default: false
    BookingUpdate:
      type: object
      properties:
        customer_name: { type: string }
        customer_email: { type: string, format: email }
        customer_phone: { type: string }
        customer_notes: { type: string }
        admin_notes: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
    Product:
      type: object
      required: [id, name, slug, price, currency, status]
      properties:
        id: { type: integer, example: 32 }
        name: { type: string, example: Cork yoga block (pair) }
        slug: { type: string, example: cork-yoga-block-pair }
        description: { type: [string, "null"] }
        short_description: { type: [string, "null"], maxLength: 500  }
        price: { type: integer, example: 2999 }
        compare_at_price: { type: [integer, "null"], example: 3999  }
        currency: { type: string, example: gbp }
        type: { type: string, enum: [physical, digital, service], example: physical }
        status: { type: string, enum: [draft, active, archived], example: active }
        sku: { type: [string, "null"], example: ND-CORK-PAIR  }
        stock_quantity: { type: [integer, "null"], example: 24  }
        track_inventory: { type: boolean, default: false }
        weight: { type: [number, "null"], format: float, example: 0.6  }
        images:
          type: array
          items: { type: string, format: uri }
        metadata: { type: object, additionalProperties: true }
        category_id: { type: [integer, "null"], example: 4  }
        featured: { type: boolean, default: false }
        published_at: { type: [string, "null"], format: date-time }
        variants:
          type: array
          items: { $ref: "#/components/schemas/ProductVariant" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductInput:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        short_description: { type: string, maxLength: 500 }
        price: { type: integer }
        compare_at_price: { type: [integer, "null"] }
        currency: { type: string }
        type: { type: string, enum: [physical, digital, service] }
        status: { type: string, enum: [draft, active, archived] }
        sku: { type: string }
        stock_quantity: { type: [integer, "null"] }
        track_inventory: { type: boolean }
        weight: { type: [number, "null"], format: float }
        images:
          type: array
          items: { type: string, format: uri }
        category_id: { type: [integer, "null"] }
        featured: { type: boolean }
        published_at: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
    ProductVariant:
      type: object
      required: [id, product_id, name, price]
      properties:
        id: { type: integer, example: 71 }
        product_id: { type: integer, example: 32 }
        name: { type: string, example: Natural cork }
        sku: { type: [string, "null"], example: ND-CORK-PAIR-N  }
        price: { type: integer, example: 2999 }
        stock_quantity: { type: [integer, "null"] }
        options:
          type: object
          description: Free-form variant options (size, color, etc.).
          additionalProperties: { type: string }
          example: { color: natural }
        sort_order: { type: integer, default: 0 }
        is_active: { type: boolean, default: true }
    ProductVariantInput:
      type: object
      properties:
        name: { type: string }
        sku: { type: string }
        price: { type: integer }
        stock_quantity: { type: [integer, "null"] }
        options:
          type: object
          additionalProperties: { type: string }
        sort_order: { type: integer }
        is_active: { type: boolean }
    ProductCategory:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer, example: 4 }
        name: { type: string, example: Studio essentials }
        slug: { type: string, example: studio-essentials }
        description: { type: [string, "null"] }
        image: { type: [string, "null"], format: uri }
        parent_id: { type: [integer, "null"] }
        sort_order: { type: integer, default: 0 }
        is_active: { type: boolean, default: true }
        children:
          type: array
          items: { $ref: "#/components/schemas/ProductCategory" }
    ProductCategoryInput:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        image: { type: string, format: uri }
        parent_id: { type: [integer, "null"] }
        sort_order: { type: integer }
        is_active: { type: boolean }
    OrderItem:
      type: object
      required: [name, quantity, unit_price, total]
      properties:
        product_id: { type: [integer, "null"], description: "Null if the product was deleted after the order was placed."  }
        product_variant_id: { type: [integer, "null"] }
        name: { type: string, description: "Snapshot of product name at order time." }
        sku: { type: [string, "null"] }
        quantity: { type: integer, example: 1 }
        unit_price: { type: integer, example: 2999 }
        total: { type: integer, example: 2999 }
        metadata: { type: object, additionalProperties: true }
    Order:
      type: object
      required: [id, order_number, customer_email, status, payment_status, total, currency]
      properties:
        id: { type: integer, example: 901 }
        order_number: { type: string, example: ND-1745014102-A8F2 }
        customer_name: { type: string }
        customer_email: { type: string, format: email }
        customer_phone: { type: [string, "null"] }
        status:
          type: string
          enum: [pending, paid, processing, shipped, delivered, cancelled, refunded]
        payment_status:
          type: string
          enum: [unpaid, paid, partially_refunded, refunded, failed]
        subtotal: { type: integer }
        tax_amount: { type: integer }
        shipping_amount: { type: integer }
        discount_amount: { type: integer }
        total: { type: integer }
        currency: { type: string, example: gbp }
        payment_method: { type: [string, "null"], enum: [stripe, manual]  }
        billing_address:
          type: [object, "null"]
          additionalProperties: true
        shipping_address:
          type: [object, "null"]
          additionalProperties: true
        notes: { type: [string, "null"] }
        admin_notes: { type: [string, "null"], description: "Hidden in public lookups."  }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        paid_at: { type: [string, "null"], format: date-time }
        shipped_at: { type: [string, "null"], format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrderInput:
      type: object
      required: [items, customer]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: integer }
              variant_id: { type: integer }
              quantity: { type: integer, minimum: 1 }
        customer:
          type: object
          required: [name, email]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: string }
        billing_address: { type: object, additionalProperties: true }
        shipping_address: { type: object, additionalProperties: true }
        payment_method: { type: string, enum: [stripe, manual], default: stripe }
        notes: { type: string }
    CheckoutSessionInput:
      type: object
      required: [items, customer, success_url, cancel_url]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: integer }
              variant_id: { type: integer }
              quantity: { type: integer, minimum: 1 }
        customer:
          type: object
          required: [name, email]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: string }
        success_url:
          type: string
          format: uri
          description: |
            Stripe redirects here after successful payment. May contain
            `{CHECKOUT_SESSION_ID}` placeholder which Stripe replaces.
        cancel_url:
          type: string
          format: uri
        metadata:
          type: object
          additionalProperties: { type: string }
    CheckoutSession:
      type: object
      required: [order_id, stripe_session_id, checkout_url, expires_at]
      properties:
        order_id: { type: integer, example: 902 }
        stripe_session_id: { type: string, example: cs_live_a1b2c3d4 }
        checkout_url: { type: string, format: uri, example: "https://checkout.stripe.com/c/pay/cs_live_a1b2c3d4" }
        expires_at: { type: string, format: date-time }
    JobStatus:
      type: string
      enum: [pending, processing, completed, failed, cancelled]
    JobType:
      type: string
      enum:
        - blog_post.generate
        - social_post.generate
        - image.generate
        - translation.batch
        - content_plan.generate
        - website.generate
    Job:
      type: object
      required: [id, type, status, created_at]
      properties:
        id: { type: string, example: job_2Ngd9KqLmRpW }
        type: { $ref: "#/components/schemas/JobType" }
        status: { $ref: "#/components/schemas/JobStatus" }
        progress:
          type: integer
          minimum: 0
          maximum: 100
        message: { type: string }
        steps:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              completed: { type: boolean }
              active: { type: boolean }
        result:
          type: [object, "null"]
          additionalProperties: true
          description: |
            Result payload when `status` is `completed`. Shape depends on `type`:

            - `blog_post.generate` → `{ post_id, slug, title }`
            - `social_post.generate` → `{ social_post_id, title, platforms }`
            - `image.generate` → `{ url, key, width, height }`
            - `translation.batch` → `{ keys_translated: int, locales: [string] }`
        error:
          type: [object, "null"]
          properties:
            code: { type: string, example: upstream_unavailable }
            message: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WebhookEvent:
      type: string
      description: All webhook event topics emitted by the platform.
      enum:
        - blog_post.published
        - blog_post.translated
        - social_post.published
        - social_post.failed
        - order.created
        - order.paid
        - order.fulfilled
        - order.cancelled
        - order.refunded
        - booking.confirmed
        - booking.cancelled
        - booking.completed
        - content.changed
        - image.generated
        - connect.account_updated
    WebhookEndpoint:
      type: object
      required: [id, url, events, is_active, created_at]
      properties:
        id: { type: string, example: whe_2NgcaXxFqLPo }
        url: { type: string, format: uri }
        events:
          type: array
          items: { $ref: "#/components/schemas/WebhookEvent" }
        is_active: { type: boolean }
        last_delivery_status:
          type: [string, "null"]
          enum: [success, failed, pending, null]
        last_delivery_at:
          type: [string, "null"]
          format: date-time
        created_at: { type: string, format: date-time }
    WebhookEndpointInput:
      type: object
      required: [url, events]
      properties:
        url: { type: string, format: uri }
        events:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WebhookEvent" }
        is_active: { type: boolean, default: true }
    WebhookEndpointWithSecret:
      allOf:
        - $ref: "#/components/schemas/WebhookEndpoint"
        - type: object
          required: [signing_secret]
          properties:
            signing_secret:
              type: string
              description: |
                HMAC-SHA256 secret used to sign every delivery from this
                endpoint. Returned **only at creation**. Use it to verify the
                `X-Neural-Draft-Signature` header on incoming requests.
              example: whsec_OmtQ9X5gTzUv7sR1kBhJnAeYpV2cDfWiM3oP
    WebhookDelivery:
      type: object
      required: [id, endpoint_id, event, status, attempts, created_at]
      properties:
        id: { type: string, example: whd_2Nh4PqRsTuVw }
        endpoint_id: { type: string, example: whe_2NgcaXxFqLPo }
        event: { $ref: "#/components/schemas/WebhookEvent" }
        status: { type: string, enum: [success, failed, pending] }
        response_status:
          type: [integer, "null"]
          description: HTTP status returned by the receiving server, if any.
        response_body:
          type: [string, "null"]
          description: First 1KB of the response body, for debugging.
        attempts: { type: integer, minimum: 1 }
        next_retry_at:
          type: [string, "null"]
          format: date-time
        delivered_at:
          type: [string, "null"]
          format: date-time
        created_at: { type: string, format: date-time }
    Error:
      type: object
      description: |
        RFC 7807 problem+json error. The `code` is a stable machine
        identifier; clients should branch on `code`, never on `title`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          example: https://api.neuraldraft.io/errors/validation_failed
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: One or more fields failed validation.
        instance:
          type: string
          description: Request id (also returned as `X-Request-Id` header).
          example: req_2Nh4PqRsTuVw
        code:
          type: string
          description: |
            Stable machine error code. Standard values:
            `bad_request`, `unauthorized`, `out_of_credits`, `forbidden`,
            `not_found`, `conflict`, `validation_failed`, `rate_limited`,
            `internal_error`, `service_unavailable`, `slot_unavailable`,
            `connect_not_ready`, `upstream_unavailable`, `idempotency_conflict`.
          example: validation_failed
        errors:
          type: object
          description: Field-level validation errors (only on 422).
          additionalProperties:
            type: array
            items: { type: string }
