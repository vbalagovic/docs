                  format: binary
                  description: Image file (jpg/jpeg/png/webp/gif/svg). Max 10MB.
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2000
                  description: Direct image URL (mode 2). Mutually exclusive with `regenerate`.
                regenerate:
                  type: boolean
                  description: If true, regenerate via AI (mode 3); requires `prompt`.
                prompt: { type: string, minLength: 3, maxLength: 1000 }
                style: { type: string, example: photorealistic }
                aspect_ratio: { type: string, example: "16:9" }
