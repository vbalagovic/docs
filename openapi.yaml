    post:
      tags: [Images]
      summary: Generate or upload an image
      description: |
        Two modes — discriminated by the request `Content-Type`:

        1. **AI generation** (`application/json`) — kicks off async generation
           inheriting the project's brand context. Returns a [`Job`](#tag/Jobs)
           with `type: image.generate`. On completion, `result` contains
           `{ url, key, width, height }`. Costs **40 credits**.
        2. **Direct upload** (`multipart/form-data`) — synchronous swap with
           the uploaded file bytes. `file` and `key` are required. Returns the
           registered [`Image`](#/components/schemas/Image) immediately. Costs
           **0 credits**. Max 10MB; jpg/jpeg/png/webp/gif/svg only.
      operationId: createImage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageGenerateInput" }
            examples:
              hero:
                value:
                  prompt: A serene yoga studio at dawn, soft sage and linen tones, no people
                  style: photorealistic
                  aspect_ratio: "16:9"
                  key: hero.background
          multipart/form-data:
            schema:
              type: object
              required: [file, key]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (jpg/jpeg/png/webp/gif/svg). Max 10MB.
                key:
                  type: string
                  pattern: "^[\\w.\\-\\/]+$"
                  example: hero.background
                  description: Stable image key.
      responses:
        "201":
          description: Image uploaded (multipart mode).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Image" }
        "202":
          description: Generation job queued (JSON mode).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: Uploaded file exceeds 10MB (multipart mode).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
      x-codeSamples:
        - lang: curl
          label: cURL (AI)
          source: |
            curl -X POST https://api.neuraldraft.io/v1/images \
              -H "Authorization: Bearer ndsk_live_yourkey" \
              -H "Content-Type: application/json" \
              -d '{"prompt":"Serene yoga studio at dawn","style":"photorealistic","aspect_ratio":"16:9","key":"hero.background"}'
        - lang: curl
          label: cURL (upload)
          source: |
            curl -X POST https://api.neuraldraft.io/v1/images \
              -H "Authorization: Bearer ndsk_live_yourkey" \
              -F "file=@hero.jpg" \
              -F "key=hero.background"
        - lang: node
          label: Node (SDK — AI)
          source: |
            const job = await nd.images.generate({ prompt: "Serene yoga studio", aspect_ratio: "16:9", key: "hero.background" });
            const done = await nd.jobs.poll(job.id);
            console.log(done.result.url);
        - lang: node
          label: Node (SDK — upload)
          source: |
            const file = await fs.openAsBlob("hero.jpg");
            const img = await nd.images.upload("hero.background", file);
            console.log(img.url);
        - lang: python
          label: Python (AI)
          source: |
            job = requests.post(
                "https://api.neuraldraft.io/v1/images",
                headers={"Authorization": f"Bearer {key}"},
