  /content/bulk:
    get:
      tags: [Content]
      summary: Bulk read content keys
      description: |
        Returns values for many translation keys in one round trip. Designed
        for build-time / SSG fetches: pass every key your page references and
        get a flat `{key: value}` map back.

        Cacheable — the response includes `Cache-Control: public, max-age=60`
        and an `ETag`. Re-fetch with `If-None-Match` to revalidate cheaply.

        Read-only. Does not consume credits.
      operationId: getContentBulk
      parameters:
        - in: query
          name: keys
          required: true
          schema:
            type: string
          description: |
            Comma-separated list of translation keys. Up to 200 per request.
            Keys use `dot.notation` (e.g. `hero.headline,hero.cta,footer.copy`).
          example: hero.headline,hero.cta,footer.copy
        - in: query
          name: lang
          schema:
            type: string
            example: en
          description: |
            BCP-47 language tag. Defaults to the project's default language.
            Falls back to default language if a key is not translated.
        - in: query
          name: scope
          schema:
            type: string
            enum: [page, component]
          description: Optional filter — limit to keys tied to a specific scope type.
        - in: query
          name: scope_id
          schema:
            type: integer
          description: Used together with `scope` to filter further.
      responses:
        "200":
          description: Map of key → value.
          headers:
            ETag:
              schema: { type: string }
              description: Strong ETag for the result set.
            Cache-Control:
              schema: { type: string }
              description: Caching directive — typically `public, max-age=60`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                example:
                  hero.headline: Find your calm, one breath at a time
                  hero.cta: Book a class
                  footer.copy: © 2026 Lakeside Yoga
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl "https://api.neuraldraft.io/v1/content/bulk?keys=hero.headline,hero.cta&lang=en" \
              -H "Authorization: Bearer ndsk_live_yourkey"
        - lang: node
          label: Node (SDK)
          source: |
            const map = await nd.content.bulk(["hero.headline", "hero.cta"], { lang: "en" });
        - lang: python
          label: Python
          source: |
            r = requests.get(
                "https://api.neuraldraft.io/v1/content/bulk",
                params={"keys": "hero.headline,hero.cta", "lang": "en"},
                headers={"Authorization": f"Bearer {key}"},
            )
            content_map = r.json()
        - lang: php
          label: PHP
          source: |
            <?php
            $map = json_decode((string) $client->get('content/bulk', [
              'query' => ['keys' => 'hero.headline,hero.cta', 'lang' => 'en'],
              'headers' => ['Authorization' => 'Bearer '.$key],
            ])->getBody(), true);
  /content/{key}:
    parameters:
      - $ref: "#/components/parameters/ContentKeyPath"
    get:
      tags: [Content]
      summary: Read a single content value
      description: |
        Returns the resolved value for the given key in the requested
        language, plus all available locales for the key.

        Read-only. Does not consume credits.
      operationId: getContentKey
      parameters:
