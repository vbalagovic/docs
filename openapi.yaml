                status: 500
                detail: Something went wrong on our end. Try again or contact support.
                code: internal_error
                instance: req_2Nh4PqRsTuVw
    ServiceUnavailable:
      description: |
        Temporarily unavailable — typical during Cloud Run cold starts or
        when an upstream AI service is throttling. Safe to retry with
        exponential backoff after `Retry-After` seconds.
      headers:
        Retry-After: { schema: { type: integer } }
        X-Request-Id: { schema: { type: string } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
