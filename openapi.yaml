          label: Node (SDK)
          source: |
            await nd.webhooks.deliveries.retry("whd_2Nh5XyZAbCdE");
        - lang: python
          label: Python
          source: |
            requests.post("https://api.neuraldraft.io/v1/webhook-deliveries/whd_2Nh5XyZAbCdE/retry",
              headers={"Authorization": f"Bearer {key}"})
        - lang: php
          label: PHP
          source: |
            <?php
            $client->post('webhook-deliveries/whd_2Nh5XyZAbCdE/retry', [
              'headers' => ['Authorization' => 'Bearer '.$key],
            ]);
  /newsletters/subscribe:
    post:
      tags: [Forms]
      summary: Subscribe to a project newsletter
      description: |
        **Public** endpoint — no API key required when called from a browser
        embed. The project is resolved via the
        `X-NeuralDraft-Project-Key` header (recommended for server-side calls)
        or `?project_id=<id>` query param (browser embeds where you can't
        ship a secret key). Idempotent — re-submitting an existing email
        returns 200 with `status="already_subscribed"` rather than an error.
        Free; no credits charged.
      operationId: subscribeNewsletter
      security: []
      parameters:
        - in: header
          name: X-NeuralDraft-Project-Key
          schema: { type: string }
          required: false
          description: Project API key (alternative to query param).
        - in: query
          name: project_id
          schema: { type: integer }
          required: false
          description: Project ID for unauthenticated browser embeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                app_lead:
                  type: boolean
                  default: false
                  description: Marks the lead as coming from a "want the app" landing surface vs. a regular newsletter signup.
            examples:
              basic:
                value: { email: "jane@example.com" }
              app_lead:
                value: { email: "jane@example.com", app_lead: true }
      responses:
        "201":
          description: New subscription created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/NewsletterSubscription"
        "200":
          description: Email already subscribed (idempotent).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/NewsletterSubscription"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /newsletters:
    get:
      tags: [Forms]
      summary: List newsletter subscribers
      description: Requires `forms:read` scope.
      operationId: listNewsletter
      parameters:
        - in: query
          name: app_lead
          schema: { type: boolean }
          description: Filter to/from app-lead-only subscribers.
        - in: query
          name: search
          schema: { type: string, maxLength: 255 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Paginated subscribers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/NewsletterSubscription" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /newsletters/{id}:
    delete:
      tags: [Forms]
      summary: Delete (unsubscribe) a newsletter subscriber
      description: Requires `forms:write` scope.
      operationId: destroyNewsletter
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Subscriber removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /contact-forms:
    post:
      tags: [Forms]
      summary: Submit a contact form
      description: |
        **Public** endpoint — no API key required when called from a browser
        embed. The project is resolved via the
        `X-NeuralDraft-Project-Key` header or `?project_id=<id>` query param.
        `data` is free-form JSON for whatever your form collects; IP and
        user-agent are merged in server-side for spam triage.
        Free; no credits charged.
      operationId: submitContactForm
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                subject: { type: [string, "null"], maxLength: 500 }
                message: { type: [string, "null"], maxLength: 10000 }
                data:
                  type: object
                  additionalProperties: true
                  description: Arbitrary JSON for custom form fields.
      responses:
        "201":
          description: Submission stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ContactFormSubmission"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      tags: [Forms]
      summary: List contact-form submissions
      description: Requires `forms:read` scope.
      operationId: listContactForms
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 255 }
          description: Substring match against email, subject, message.
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Paginated submissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContactFormSubmission" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /contact-forms/{id}:
    delete:
      tags: [Forms]
      summary: Delete a contact-form submission
      description: Requires `forms:write` scope.
      operationId: destroyContactForm
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Submission removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: |
        Project API key. Pass as `Authorization: Bearer ndsk_live_...`. Manage
        keys via [`/projects/me/api-keys`](#tag/Projects). Test-mode keys use
        the `ndsk_test_` prefix.
  parameters:
    PageQuery:
      in: query
      name: page
      schema: { type: integer, default: 1, minimum: 1 }
      description: 1-based page number.
    PageSizeQuery:
      in: query
      name: page_size
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      description: Items per page (max 100).
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      schema: { type: string, maxLength: 255 }
      description: |
        Unique key (any string up to 255 chars; UUID recommended). Retries
        with the same key within 24 hours return the original response without
        re-executing side effects.
    KeyIdPath:
      in: path
      name: key_id
      required: true
      schema: { type: string }
      description: API key id (e.g. `key_2Ngc7HpQrZk1`).
    ContentKeyPath:
      in: path
      name: key
      required: true
      schema: { type: string, example: hero.headline }
      description: Translation key in `dot.notation`.
    ImageKeyPath:
      in: path
      name: key
      required: true
      schema: { type: string, example: hero.background }
      description: Image key (any URL-safe identifier).
    ComponentIdPath:
      in: path
      name: id
      required: true
      schema: { type: string, example: cmp_2Ngd9KqLmRpW }
    BlogPostIdPath:
      in: path
      name: id
      required: true
      schema: { type: integer, example: 142 }
    CategoryIdPath:
      in: path
      name: id
      required: true
      schema: { type: integer }
    TagIdPath:
      in: path
      name: id
      required: true
      schema: { type: integer }
    SocialPostIdPath:
      in: path
      name: id
      required: true
      schema: { type: integer, example: 88 }
    SocialAccountIdPath:
      in: path
      name: id
      required: true
      schema: { type: string, example: sac_2N1AbCdEfGhI }
    BookableServiceIdPath:
      in: path
      name: id
      required: true
      schema: { type: integer, example: 12 }
    BookingIdPath:
      in: path
      name: id
      required: true
      schema: { type: integer, example: 503 }
    ProductIdPath:
      in: path
      name: id
      required: true
      schema: { type: integer, example: 32 }
    OrderIdPath:
      in: path
      name: id
      required: true
      schema: { type: integer, example: 901 }
    JobIdPath:
      in: path
      name: id
      required: true
      schema: { type: string, example: job_2Ngd9KqLmRpW }
    WebhookEndpointIdPath:
      in: path
      name: id
      required: true
      schema: { type: string, example: whe_2NgcaXxFqLPo }
  schemas:
    Health:
      type: object
      required: [status, version, uptime_s]
      properties:
        status: { type: string, enum: [ok], example: ok }
        version: { type: string, example: "1.0.0" }
        uptime_s: { type: integer, example: 184523 }
    Project:
      type: object
      required: [id, name, slug, default_language, target_languages, plan, created_at]
      properties:
        id: { type: string, example: prj_2NfQmBcKpXY8 }
        name: { type: string, example: Lakeside Yoga }
        slug: { type: string, example: lakeside-yoga }
        industry: { type: [string, "null"], example: wellness  }
        default_language: { type: string, example: en }
        target_languages:
          type: array
          items: { type: string }
          example: [en, fr, de]
        timezone: { type: string, example: Europe/London }
        plan: { type: string, enum: [free, hobby, build, scale, enterprise], example: hobby }
        created_at: { type: string, format: date-time }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        industry: { type: string }
        default_language: { type: string }
        target_languages:
          type: array
          items: { type: string }
        timezone: { type: string }
    Usage:
      type: object
      required: [period_start, period_end, plan, plan_credits, credits_used, credits_remaining, breakdown]
      properties:
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        plan: { type: string, enum: [free, hobby, build, scale, enterprise] }
        plan_credits: { type: integer, example: 5000 }
        topup_credits: { type: integer, example: 2000 }
        credits_used: { type: integer, example: 3260 }
        credits_remaining: { type: integer, example: 3740 }
        breakdown:
          type: array
          items: { $ref: "#/components/schemas/UsageBreakdown" }
    UsageBreakdown:
      type: object
      required: [op, count, credits]
      properties:
        op:
          type: string
          description: Operation identifier.
          example: blog_post.generate
        count:
          type: number
          description: Number of executions in the period.
          example: 4
        credits:
          type: integer
          description: Credits consumed by this op.
          example: 1600
    ApiKey:
      type: object
      required: [id, name, prefix, masked, scopes, created_at]
      properties:
        id: { type: string, example: key_2NfQB5GdkY9P }
        name: { type: string, example: Production server }
        prefix: { type: string, example: ndsk_live_ }
        masked: { type: string, example: ndsk_live_…7yQp }
        scopes:
          type: array
          items: { type: string }
          example: [content:read, content:write]
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    ApiKeyCreate:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, example: CI builds }
        scopes:
          type: array
          items: { type: string }
          example: [content:read, blog:read]
    ApiKeyWithSecret:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Full secret value. Returned **only once** at creation.
              example: ndsk_live_a5oqV2uY3sR8mD7fK9hP4tWcXeZi6jLg7yQpaB91
    BrandColor:
      type: object
      required: [hex]
      properties:
        hex: { type: string, pattern: "^#([0-9A-Fa-f]{6})$", example: "#3F6B5C" }
        name: { type: string, example: deep sage }
    Brand:
      type: object
      properties:
        voice:
          type: string
          description: Free-form description of the brand voice.
          example: warm, grounded, inviting; avoids hype
        audience:
          type: string
          example: women 30-55 in greater London seeking stress relief
        content_tone:
          type: string
          enum: [friendly_professional, formal, playful, authoritative, warm, witty]
          example: friendly_professional
        content_goals:
          type: array
          items: { type: string }
          example: [drive_class_signups, build_email_list]
        preferred_topics:
          type: array
          items: { type: string }
          example: [breathwork, beginner_yoga, prenatal_yoga, mindfulness]
        colors:
          type: object
          properties:
            primary: { $ref: "#/components/schemas/BrandColor" }
            secondary: { $ref: "#/components/schemas/BrandColor" }
        fonts:
          type: object
          properties:
            heading: { type: string, example: Fraunces }
            body: { type: string, example: Inter }
        logo_url:
          type: [string, "null"]
          format: uri
          example: https://cdn.neuraldraft.io/prj_2NfQmBcKpXY8/logo.svg
        description:
          type: string
          example: A boutique yoga studio in Richmond offering small-group classes.
        languages:
          type: array
          description: Languages configured on this project.
          items: { $ref: "#/components/schemas/Language" }
    BrandUpdate:
      type: object
      properties:
        voice: { type: string }
        audience: { type: string }
        content_tone: { type: string, enum: [friendly_professional, formal, playful, authoritative, warm, witty] }
        content_goals:
          type: array
          items: { type: string }
        preferred_topics:
          type: array
          items: { type: string }
        colors:
          type: object
          properties:
            primary: { $ref: "#/components/schemas/BrandColor" }
            secondary: { $ref: "#/components/schemas/BrandColor" }
        fonts:
          type: object
          properties:
            heading: { type: string }
            body: { type: string }
        logo_url:
          type: [string, "null"]
          format: uri
        description: { type: string }
    Language:
      type: object
      required: [code, name, is_default]
      properties:
        code: { type: string, example: en }
        name: { type: string, example: English }
        is_default: { type: boolean, example: true }
    ContentValue:
      type: object
      required: [key, value, lang]
      properties:
        key: { type: string, example: hero.headline }
        value: { type: string, example: "Find your calm, one breath at a time" }
        lang: { type: string, example: en }
        all_locales:
          type: object
          additionalProperties: { type: string }
          example:
            en: Find your calm, one breath at a time
            fr: Trouvez votre calme, une respiration à la fois
    ContentValueInput:
      type: object
      required: [value]
      properties:
        lang:
          type: string
          example: en
          description: BCP-47 language tag. Defaults to project default.
        value: { type: string, example: Welcome to Lakeside Yoga }
    Page:
      type: object
      required: [id, slug, title, type, is_homepage, is_active]
      properties:
        id: { type: integer, example: 42 }
        slug: { type: string, example: about }
        title: { type: string, example: About us }
        type:
          type: string
          enum: [landing, blog_list, blog_post, legal]
          default: landing
        is_homepage: { type: boolean, example: false }
        is_active: { type: boolean, example: true }
        exclude_from_search: { type: boolean, example: false }
        meta_title: { type: [string, "null"], example: "About — Acme" }
        meta_description: { type: [string, "null"] }
        og_title: { type: [string, "null"] }
        og_description: { type: [string, "null"] }
        og_image: { type: [string, "null"], format: uri }
        canonical_url: { type: [string, "null"], format: uri }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PageCreateInput:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9\-/]+$'
          example: about
        title: { type: string, example: About us }
        type:
          type: string
          enum: [landing, blog_list, blog_post, legal]
          default: landing
        is_homepage: { type: boolean, default: false }
        is_active: { type: boolean, default: true }
        exclude_from_search: { type: boolean, default: false }
        meta_title: { type: string }
        meta_description: { type: string }
        og_title: { type: string }
        og_description: { type: string }
        og_image: { type: string, format: uri }
        canonical_url: { type: string, format: uri }
    PageUpdateInput:
      type: object
      description: |
        Patch shape — every field is optional. Pass `null` on a meta field
        to clear it. Untouched fields are preserved (merge semantics).
      properties:
        slug: { type: string, pattern: '^[a-z0-9\-/]+$' }
        title: { type: string }
        type:
          type: string
          enum: [landing, blog_list, blog_post, legal]
        is_homepage: { type: boolean }
        is_active: { type: boolean }
        exclude_from_search: { type: boolean }
        meta_title: { type: [string, "null"] }
        meta_description: { type: [string, "null"] }
        og_title: { type: [string, "null"] }
        og_description: { type: [string, "null"] }
        og_image: { type: [string, "null"], format: uri }
        canonical_url: { type: [string, "null"], format: uri }
    Component:
      type: object
      required: [id, html, created_at, updated_at]
      properties:
        id: { type: string, example: cmp_2Ngd9KqLmRpW }
        intent:
          type: [string, "null"]
          example: marketing_hero
        page_slug:
          type: [string, "null"]
          example: home
        html: { type: string }
        keys_created:
          type: array
          items: { type: string }
          example: [hero.headline, hero.subhead, hero.cta]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ComponentRegisterInput:
      type: object
      required: [html]
      properties:
        html:
          type: string
          description: |
            HTML chunk to register. Any `data-translate="key"` attributes are
            extracted into the project's content keys. Any `data-image-key="key"`
            attributes are registered as image slots.
        intent:
          type: string
          example: marketing_hero
        page_slug:
          type: string
          example: home
    ComponentUpdateInput:
      type: object
      required: [html]
      properties:
        html: { type: string }
    Image:
      type: object
      required: [key, url]
      properties:
        key: { type: string, example: hero.background }
        url:
          type: [string, "null"]
          format: uri
          example: "https://cdn.neuraldraft.io/prj_2NfQmBcKpXY8/hero-background-89hf.jpg"
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
        width: { type: integer, example: 2048 }
        height: { type: integer, example: 1152 }
        bytes: { type: integer, example: 482911 }
        mime_type: { type: string, example: image/jpeg }
        generated:
          type: boolean
          description: True if produced by AI generation; false if uploaded.
          example: true
    ImageGenerateInput:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          example: A serene yoga studio at dawn, soft sage and linen tones, no people
        style:
          type: string
          example: photorealistic
        aspect_ratio:
          type: string
          enum: ["1:1", "16:9", "9:16", "4:5", "4:3", "3:2"]
          default: "16:9"
        key:
          type: string
          description: Optional. If provided, the image is also addressable by this key.
          example: hero.background
    Category:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer, example: 7 }
        name: { type: string, example: Wellness }
        slug: { type: string, example: wellness }
    Tag:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer, example: 21 }
        name: { type: string, example: breathwork }
        slug: { type: string, example: breathwork }
    BlogPostTranslation:
      type: object
      required: [lang, title, content]
      properties:
        lang: { type: string, example: en }
        title: { type: string }
        excerpt: { type: [string, "null"] }
        content: { type: string, description: "HTML." }
        meta_title: { type: [string, "null"] }
        meta_description: { type: [string, "null"] }
    BlogPost:
      type: object
      required: [id, slug, status, title]
      properties:
        id: { type: integer, example: 142 }
        slug: { type: string, example: 5-minute-breathwork-for-anxious-mornings }
        status:
          type: string
          enum: [draft, published, scheduled, archived]
          example: published
        featured_image:
          type: [string, "null"]
          format: uri
        published_at:
          type: [string, "null"]
          format: date-time
        scheduled_at:
          type: [string, "null"]
          format: date-time
        title: { type: string }
        excerpt:
          type: [string, "null"]
        content:
          type: [string, "null"]
          description: "HTML for the requested language. Returned by `GET /blog-posts/{id_or_slug}` only."
        meta_title:
          type: [string, "null"]
        meta_description:
          type: [string, "null"]
        category:
          oneOf:
            - $ref: "#/components/schemas/Category"
            - type: "null"
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
        translations:
          type: array
          items: { $ref: "#/components/schemas/BlogPostTranslation" }
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BlogPostManualInput:
      type: object
      required: [title, content, language_code]
      properties:
        title: { type: string }
        slug: { type: string, description: Optional. Auto-generated if omitted. }
        content: { type: string, description: HTML body. }
        excerpt: { type: string }
        meta_title: { type: string }
        meta_description: { type: string }
        language_code: { type: string, example: en }
        category_id: { type: integer }
        tag_ids:
          type: array
          items: { type: integer }
        featured_image: { type: string, format: uri }
        status:
          type: string
          enum: [draft, published, scheduled]
          default: draft
    BlogPostAIInput:
      type: object
      required: [ai]
      properties:
        ai:
          type: object
          required: [topic]
          properties:
            topic: { type: string, example: 5-minute breathwork for anxious mornings }
            style: { type: string, example: friendly_professional }
            word_count: { type: integer, default: 1200, minimum: 200, maximum: 5000 }
            translate_to_all: { type: boolean, default: false }
            additional_instructions: { type: string }
            target_audience: { type: string }
            primary_keyword: { type: string }
            secondary_keywords:
              type: array
              items: { type: string }
            image_style: { type: string, example: warm_lifestyle_photo }
            enable_research: { type: boolean, default: true }
            research_depth: { type: string, enum: [shallow, normal, deep], default: normal }
            reference_urls:
              type: array
              items: { type: string, format: uri }
            category_id: { type: integer }
            tag_ids:
              type: array
              items: { type: integer }
    BlogPostUpdate:
      type: object
      properties:
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string }
        content: { type: string }
        meta_title: { type: string }
        meta_description: { type: string }
        category_id: { type: [integer, "null"] }
        tag_ids:
          type: array
          items: { type: integer }
        featured_image: { type: [string, "null"], format: uri }
        status: { type: string, enum: [draft, published, scheduled, archived] }
    SocialPlatform:
      type: string
      enum: [facebook, instagram, twitter, tiktok, linkedin, youtube]
    SocialPost:
      type: object
      required: [id, platforms, status]
      properties:
        id: { type: integer, example: 88 }
        title: { type: string, example: New Saturday morning class }
        platforms:
          type: array
          items: { $ref: "#/components/schemas/SocialPlatform" }
          example: [facebook, instagram]
        status:
          type: string
          enum: [draft, scheduled, published, failed]
          example: scheduled
        media_type:
          type: [string, "null"]
          enum: [image, video, carousel]
        media:
          type: array
          items: { type: string, format: uri }
        content_per_platform:
          type: object
          description: Platform-specific copy.
          additionalProperties: { type: string }
          example:
            facebook: New Saturday morning class — book now → lakesideyoga.uk
            instagram: Slow down. Breathe. ✨ New Saturday morning class — link in bio.
        scheduled_at:
          type: [string, "null"]
          format: date-time
        published_at:
          type: [string, "null"]
          format: date-time
        publish_results:
          type: [object, "null"]
          description: Per-platform publish outcomes.
          additionalProperties:
            type: object
            properties:
              ok: { type: boolean }
              external_id: { type: string }
              error: { type: string }
          example:
            instagram: { ok: true, external_id: "ig_178214..." }
            facebook: { ok: false, error: "Token expired" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SocialPostManualInput:
      type: object
      required: [title, platforms]
      properties:
        title: { type: string }
        platforms:
          type: array
          items: { $ref: "#/components/schemas/SocialPlatform" }
          minItems: 1
        facebook_content: { type: string }
        instagram_content: { type: string }
        twitter_content: { type: string }
        tiktok_content: { type: string }
        linkedin_content: { type: string }
        youtube_content: { type: string }
        media_type: { type: string, enum: [image, video, carousel] }
        media:
          type: array
          items: { type: string, format: uri }
        scheduled_at: { type: string, format: date-time }
    SocialPostAIInput:
      type: object
      required: [ai]
      properties:
        ai:
          type: object
          required: [platforms]
          properties:
            topic: { type: string, description: Free-form topic. Required unless `post_id` provided. }
            post_id:
              type: integer
              description: Generate from an existing blog post id.
            tone:
              type: string
              enum: [warm, formal, playful, authoritative, witty]
              default: warm
            platforms:
              type: array
              items: { $ref: "#/components/schemas/SocialPlatform" }
              minItems: 1
            media_type:
              type: string
              enum: [none, image, video, carousel]
              default: image
            visual_style: { type: string, example: warm_lifestyle_photo }
            additional_instructions: { type: string }
            mode: { type: string, enum: [direct, preview], default: direct }
    SocialPostUpdate:
      type: object
      properties:
        title: { type: string }
        platforms:
          type: array
          items: { $ref: "#/components/schemas/SocialPlatform" }
        facebook_content: { type: string }
        instagram_content: { type: string }
        twitter_content: { type: string }
        tiktok_content: { type: string }
        linkedin_content: { type: string }
        youtube_content: { type: string }
        scheduled_at: { type: string, format: date-time }
    SocialAccount:
      type: object
      required: [id, platform, is_active]
      properties:
        id: { type: string, example: sac_2N1AbCdEfGhI }
        platform: { $ref: "#/components/schemas/SocialPlatform" }
        username: { type: string, example: lakeside.yoga }
        platform_user_id: { type: string, example: "10221456712" }
        is_active: { type: boolean }
        expires_at: { type: [string, "null"], format: date-time }
        connected_at: { type: string, format: date-time }
    BookableService:
      type: object
      required: [id, name, slug, price, currency, status]
      properties:
        id: { type: integer, example: 12 }
        name: { type: string, example: 60-minute private yoga }
        slug: { type: string, example: 60-minute-private-yoga }
        description: { type: [string, "null"] }
        short_description: { type: [string, "null"], maxLength: 500  }
        price:
          type: integer
          description: Price in the smallest currency unit (cents/pence).
          example: 7500
        currency: { type: string, example: gbp, minLength: 3, maxLength: 3 }
        booking_type:
          type: string
          enum: [time_slot, date_range]
          default: time_slot
          description: |
            * `time_slot` — discrete-duration appointments (default).
            * `date_range` — multi-night rentals (`min_nights`/`max_nights` apply).
        duration_minutes: { type: integer, example: 60 }
        buffer_before_minutes: { type: integer, example: 5 }
        buffer_after_minutes: { type: integer, example: 10 }
        max_bookings_per_slot: { type: integer, default: 1 }
        min_notice_hours: { type: integer, default: 1 }
        max_advance_days: { type: integer, default: 90 }
        cancellation_hours: { type: integer, default: 24 }
        min_nights: { type: [integer, "null"] }
        max_nights: { type: [integer, "null"] }
        status: { type: string, enum: [active, inactive] }
        color: { type: [string, "null"], pattern: "^#([0-9A-Fa-f]{6})$" }
        images:
          type: array
          items: { type: string, format: uri }
        sort_order: { type: integer, default: 0 }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BookableServiceInput:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        short_description: { type: string, maxLength: 500 }
        price: { type: integer }
        currency: { type: string }
        booking_type: { type: string, enum: [time_slot, date_range] }
        duration_minutes: { type: integer }
        buffer_before_minutes: { type: integer }
        buffer_after_minutes: { type: integer }
        max_bookings_per_slot: { type: integer }
        min_notice_hours: { type: integer }
        max_advance_days: { type: integer }
        cancellation_hours: { type: integer }
        min_nights: { type: integer }
        max_nights: { type: integer }
        status: { type: string, enum: [active, inactive] }
        color: { type: string, pattern: "^#([0-9A-Fa-f]{6})$" }
        images:
          type: array
          items: { type: string, format: uri }
        metadata: { type: object, additionalProperties: true }
    AvailabilitySlot:
      type: object
      required: [start, end]
      properties:
        start: { type: string, format: date-time, example: "2026-04-19T09:00:00Z" }
        end: { type: string, format: date-time, example: "2026-04-19T10:00:00Z" }
        capacity_remaining: { type: integer, example: 1 }
    Booking:
      type: object
      required: [id, booking_reference, customer_name, customer_email, starts_at, status]
      properties:
        id: { type: integer, example: 503 }
        booking_reference: { type: string, example: BK-20260419-AB12 }
        service:
          type: object
          properties:
            id: { type: integer, example: 12 }
            name: { type: string, example: 60-minute private yoga }
            slug: { type: string, example: 60-minute-private-yoga }
        customer_name: { type: string }
        customer_email: { type: string, format: email }
        customer_phone: { type: [string, "null"] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        status:
          type: string
          enum: [pending, confirmed, cancelled, completed, no_show]
        payment_status:
          type: string
          enum: [not_required, unpaid, paid, refunded]
        price_charged: { type: [integer, "null"] }
        currency: { type: string }
        customer_notes: { type: [string, "null"] }
        admin_notes: { type: [string, "null"], description: "Hidden in public lookups."  }
        cancellation_reason: { type: [string, "null"] }
        cancelled_at: { type: [string, "null"], format: date-time }
        confirmed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BookingInput:
      type: object
      required: [service_id, customer_name, customer_email, starts_at]
      properties:
        service_id: { type: integer }
        customer_name: { type: string }
        customer_email: { type: string, format: email }
        customer_phone: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at:
          type: string
          format: date-time
          description: "Required for `booking_type: date_range` services."
        customer_notes: { type: string }
        admin_notes: { type: string }
        force:
          type: boolean
