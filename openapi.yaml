              -d '{"lang":"en","value":"Welcome to Lakeside Yoga"}'
        - lang: node
          label: Node (SDK)
          source: |
            await nd.content.set("hero.headline", { lang: "en", value: "Welcome to Lakeside Yoga" });
        - lang: python
          label: Python
          source: |
            requests.put(
                "https://api.neuraldraft.io/v1/content/hero.headline",
                headers={"Authorization": f"Bearer {key}"},
                json={"lang": "en", "value": "Welcome to Lakeside Yoga"},
            )
        - lang: php
          label: PHP
          source: |
