  /jobs/{id}/stream:
    parameters:
      - $ref: "#/components/parameters/JobIdPath"
    get:
      tags: [Jobs]
      summary: Stream job progress (SSE)
      description: |
        Returns a `text/event-stream` (Server-Sent Events) feed of progress
        updates for the job. Closes automatically when the job reaches a
        terminal state (`completed`, `failed`, or `cancelled`).

        Event types emitted:

        - `progress` — `{ progress: 0-100, message: "..." }`
        - `step` — `{ name, completed, active }` (one per pipeline step transition)
        - `done` — `{ result: { ... } }` (final payload)
        - `error` — `{ code, message }` (on failure)

        Read-only. Does not consume credits.
      operationId: streamJob
      responses:
        "200":
          description: SSE stream.
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: progress
                data: {"progress":12,"message":"Researching topic"}

                event: step
                data: {"name":"write","completed":false,"active":true}

                event: progress
                data: {"progress":50,"message":"Drafting"}

                event: progress
                data: {"progress":100,"message":"Done"}

                event: done
                data: {"result":{"post_id":142,"slug":"5-minute-breathwork-for-anxious-mornings"}}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -N https://api.neuraldraft.io/v1/jobs/job_2Ngd9KqLmRpW/stream \
              -H "Authorization: Bearer ndsk_live_yourkey"
        - lang: node
          label: Node (SDK)
          source: |
            for await (const evt of nd.jobs.stream("job_2Ngd9KqLmRpW")) {
              console.log(evt.type, evt.data);
            }
        - lang: python
          label: Python
          source: |
            with requests.get("https://api.neuraldraft.io/v1/jobs/job_2Ngd9KqLmRpW/stream",
                              headers={"Authorization": f"Bearer {key}", "Accept":"text/event-stream"},
                              stream=True) as r:
                for line in r.iter_lines():
                    if line: print(line.decode())
        - lang: php
          label: PHP (Guzzle)
          source: |
            <?php
            $res = $client->get('jobs/job_2Ngd9KqLmRpW/stream', [
              'headers' => ['Authorization' => 'Bearer '.$key, 'Accept' => 'text/event-stream'],
              'stream' => true,
            ]);
            $body = $res->getBody();
            while (!$body->eof()) { echo $body->read(1024); }
