    put:
      tags: [Images]
      summary: Replace an image
      description: |
        Three replacement modes:

        1. **Upload** — `multipart/form-data` with a `file` part. Synchronous;
           returns the updated [`Image`](#/components/schemas/Image). 0 credits.
           Max 10MB; jpg/jpeg/png/webp/gif/svg only.
        2. **Direct URL** — `application/json` with `{ url }`. Synchronous;
           returns the updated [`Image`](#/components/schemas/Image). 0 credits.
        3. **Regenerate** — `application/json` with `{ regenerate: true, prompt, ... }`.
           Returns a [`Job`](#tag/Jobs) and replaces the image when complete.
           **40 credits**.
