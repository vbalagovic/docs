  /checkout-sessions:
    post:
      tags: [Commerce]
      summary: Create a Stripe Checkout session
      description: |
        Server-side or browser-side initiation of Stripe Checkout. Returns a
        `checkout_url` to redirect the buyer to. Stripe Checkout settles into
        the project's connected Stripe account. The created `Order` lives in
        `pending` until the Stripe webhook flips it to `paid`.

        Costs 0 credits — Stripe processing fees apply on the connected
        account.
      operationId: createCheckoutSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutSessionInput" }
            examples:
              two_items:
                value:
                  items:
                    - { product_id: 32, variant_id: 71, quantity: 1 }
                    - { product_id: 33, quantity: 2 }
                  customer: { name: Anna Schmidt, email: anna@example.com }
                  success_url: "https://lakesideyoga.uk/checkout/success?session_id=cs_live_a1b2c3d4"
                  cancel_url: https://lakesideyoga.uk/cart
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
              examples:
                created:
                  value:
                    order_id: 902
                    stripe_session_id: cs_live_a1b2c3d4
                    checkout_url: https://checkout.stripe.com/c/pay/cs_live_a1b2c3d4
                    expires_at: "2026-04-19T11:14:02Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "402":
          description: Project's Stripe Connect account cannot accept payments.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not_connected:
                  value:
                    type: https://api.neuraldraft.io/errors/connect_not_ready
                    title: Stripe Connect not ready
                    status: 402
                    detail: This project's Stripe Connect account is not yet onboarded.
                    code: connect_not_ready
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X POST https://api.neuraldraft.io/v1/checkout-sessions \
              -H "Authorization: Bearer ndsk_live_yourkey" \
              -H "Content-Type: application/json" \
              -H "Idempotency-Key: $(uuidgen)" \
              -d '{"items":[{"product_id":32,"quantity":1}],"customer":{"name":"Anna","email":"anna@example.com"},"success_url":"https://lakesideyoga.uk/success","cancel_url":"https://lakesideyoga.uk/cart"}'
        - lang: node
          label: Node (SDK)
          source: |
            const session = await nd.checkout.create({
              items: [{ productId: 32, quantity: 1 }],
              customer: { name: "Anna", email: "anna@example.com" },
              successUrl: "https://lakesideyoga.uk/success",
              cancelUrl: "https://lakesideyoga.uk/cart",
            });
            window.location = session.checkout_url;
        - lang: python
          label: Python
          source: |
            r = requests.post("https://api.neuraldraft.io/v1/checkout-sessions",
              headers={"Authorization": f"Bearer {key}"},
              json={"items":[{"product_id":32,"quantity":1}],"customer":{"name":"Anna","email":"anna@example.com"},"success_url":"https://lakesideyoga.uk/success","cancel_url":"https://lakesideyoga.uk/cart"})
        - lang: php
          label: PHP
          source: |
            <?php
            $session = json_decode((string) $client->post('checkout-sessions', [
              'headers' => ['Authorization' => 'Bearer '.$key],
              'json' => ['items'=>[['product_id'=>32,'quantity'=>1]],'customer'=>['name'=>'Anna','email'=>'anna@example.com'],'success_url'=>'https://lakesideyoga.uk/success','cancel_url'=>'https://lakesideyoga.uk/cart'],
            ])->getBody(), true);
  /connect/onboarding:
    post:
      tags: [Commerce]
      summary: Start Stripe Connect onboarding
      description: |
        Creates (or reuses) a Stripe Connect Express account for the project
        and returns a Stripe-hosted onboarding URL. After the user completes
        onboarding, they're sent to `return_url`. If they bail mid-flow,
