            ]);
  /content/{key}/translate:
    parameters:
      - $ref: "#/components/parameters/ContentKeyPath"
    post:
      tags: [Content]
      summary: Translate a content key
      description: |
        Asynchronously translates the value of `key` from the source language
        (default: project default) to one or more target languages.

        Returns a [`Job`](#tag/Jobs) with `type: translation.batch`. Poll
        `GET /jobs/{id}` or stream `/jobs/{id}/stream` for progress.

        Costs **70 credits per target language**. See [pricing](https://neuraldraft.io/pricing).
      operationId: translateContentKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_langs]
              properties:
                source_lang:
                  type: string
                  description: Source language. Defaults to project default.
                  example: en
                target_langs:
                  type: array
                  items: { type: string }
                  minItems: 1
                  example: [fr, de, es]
            examples:
              three_langs:
                value: { target_langs: [fr, de, es] }
      responses:
        "202":
          description: Translation job queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
              examples:
                queued:
                  value:
                    id: job_2Ngd9KqLmRpW
                    type: translation.batch
                    status: pending
                    progress: 0
                    created_at: "2026-04-19T10:14:02Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-codeSamples:
