    post:
      tags: [Social]
      summary: Create a social post
      description: |
        Two creation modes:

        1. **Manual** — provide `title`, `platforms`, and per-platform copy
           (`facebook_content`, `instagram_content`, …). Saved as draft. 0 credits.
        2. **AI generation** — provide `ai: { topic|post_id, tone, platforms,
           media_type, ... }`. Returns a [`Job`](#tag/Jobs) with
           `type: social_post.generate`. Costs **25 credits per platform**
           (so a post for 3 platforms costs 75 credits).
      operationId: createSocialPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/SocialPostManualInput"
                - $ref: "#/components/schemas/SocialPostAIInput"
            examples:
              manual:
                value:
                  title: New Saturday class announcement
                  platforms: [facebook, instagram]
                  facebook_content: New Saturday morning class — book now.
                  instagram_content: Slow down. Breathe. ✨ Saturday class — link in bio.
                  media_type: image
                  media: [https://cdn.neuraldraft.io/prj_2NfQmBcKpXY8/social/sat-class.jpg]
              ai:
                value:
                  ai:
                    topic: announce new Saturday morning class
                    tone: warm
                    platforms: [facebook, instagram, tiktok]
                    media_type: image
                    visual_style: warm_lifestyle_photo
      responses:
        "201":
          description: Manual post created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialPost" }
        "202":
          description: AI generation job queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
