          label: cURL
          source: |
            curl "https://api.neuraldraft.io/v1/content/hero.headline?lang=fr" \
              -H "Authorization: Bearer ndsk_live_yourkey"
        - lang: node
          label: Node (SDK)
          source: |
            const v = await nd.content.get("hero.headline", { lang: "fr" });
        - lang: python
          label: Python
          source: |
            v = requests.get(
                "https://api.neuraldraft.io/v1/content/hero.headline",
                params={"lang": "fr"},
                headers={"Authorization": f"Bearer {key}"},
            ).json()
        - lang: php
          label: PHP
          source: |
            <?php
            $v = json_decode((string) $client->get('content/hero.headline', [
              'query' => ['lang' => 'fr'],
              'headers' => ['Authorization' => 'Bearer '.$key],
            ])->getBody(), true);
    put:
      tags: [Content]
      summary: Set a content value
      description: |
        Upserts the value for a key in a specific language. If the key does
        not exist, it is created. If `lang` is omitted, the project's default
        language is used.

        Fires a `content.changed` webhook event to subscribers.
      operationId: putContentKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentValueInput"
            examples:
