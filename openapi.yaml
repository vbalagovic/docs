        Refuses to delete the homepage.
      operationId: deletePage
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: id_or_slug
          required: true
          schema: { type: integer }
        - in: query
          name: force
          schema: { type: boolean, default: false }
      responses:
        '204': { description: No content }
        '422': { description: Cannot delete the homepage. }
