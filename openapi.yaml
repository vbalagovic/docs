          description: Not found.
    patch:
      tags: [Pages]
      summary: Update a page (merge semantics on meta)
      description: |
        Only fields you pass are overwritten — meta keys you omit are
        preserved. Pass an explicit `null` to clear a meta field. Path
        parameter must be the numeric id (not slug) for this endpoint.
      operationId: updatePage
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: id_or_slug
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PageUpdateInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Page' }
        '404':
          description: Page not found.
        '409':
          description: Slug collision with another page.
    delete:
      tags: [Pages]
      summary: Soft-retire (default) or hard-delete (force=1) a page
      description: |
