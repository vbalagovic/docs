        sent to the `redirect_uri` you provided (or the default Neural Draft
        callback) with `?status=connected&account_id=...` appended.
      operationId: connectSocialAccount
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uri:
                  type: string
                  format: uri
                  description: Where to send the user after the OAuth flow completes.
                  example: https://app.lakesideyoga.uk/settings/social/callback
      responses:
        "200":
          description: OAuth URL.
          content:
            application/json:
              schema:
                type: object
                required: [oauth_url]
                properties:
                  oauth_url: { type: string, format: uri }
                  state: { type: string, description: Opaque state token. Pass back unchanged on callback. }
              examples:
                fb:
                  value:
                    oauth_url: https://www.facebook.com/v19.0/dialog/oauth?client_id=app123&state=abc123
                    state: abc123
